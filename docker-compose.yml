version: "3.8"

services:
  chart-inspector:
    build:
      context: /home/darek/apps/infra/chart-inspector
      dockerfile: Dockerfile
    image: chart-inspector:latest
    container_name: chart_inspector
    restart: unless-stopped
    ports:
      - "127.0.0.1:8070:8070"
    volumes:
      - /home/darek/apps/infra/chart-inspector:/app
    environment:
      - TZ=Europe/Warsaw
      - PYTHONUNBUFFERED=1
      - CHART_INSPECTOR_HOST=0.0.0.0
      - CHART_INSPECTOR_PORT=8070
      - CHART_INSPECTOR_DATA_DIR=/app/data
      - CHART_INSPECTOR_RESULTS_DIR=/app/results
      - CHART_INSPECTOR_ANNOTATIONS_DIR=/app/annotations
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8070')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
